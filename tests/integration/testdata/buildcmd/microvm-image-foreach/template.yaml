AWSTemplateFormatVersion: '2010-09-09'
Transform:
  - AWS::LanguageExtensions
  - AWS::Serverless-2016-10-31

Resources:
  Fn::ForEach::Images:
    - Name
    - [Alpha, Beta]
    - ${Name}Image:
        Type: AWS::Serverless::MicrovmImage
        Properties:
          Name: !Sub "${Name}-image"
          CodeUri: ./${Name}
          BaseImageArn: arn:aws:lambda:us-east-2:aws:microvm-image:al2023-1
          BaseImageVersion: "0"
