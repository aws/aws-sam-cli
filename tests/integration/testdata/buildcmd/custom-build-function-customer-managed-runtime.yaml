AWSTemplateFormatVersion : '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  CodeUri:
    Type: String
  Handler:
    Type: String
  BuildMethod:
    Type: String

Resources:

  Function:
    Type: AWS::Serverless::Function
    Properties:
      Handler: !Ref Handler
      Runtime: custom
      CodeUri: !Ref CodeUri
      Timeout: 600
      RuntimeConfig:
        RuntimeArn: arn:aws:lambda:us-east-1:123456789012:runtime/fake
        RuntimeAlias: fake
    Metadata:
      BuildMethod: !Ref BuildMethod
