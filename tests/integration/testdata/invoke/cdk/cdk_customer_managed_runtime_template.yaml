Resources:
  # A CDK-synthesized AWS::Lambda::Function on a customer-managed runtime: Runtime custom with
  # RuntimeConfig. RuntimeConfig is a flat passthrough with no CDK-specific nesting. The test passes
  # --invoke-image, so RuntimeArn and RuntimeAlias are never looked up.
  customermanagedruntimefunctionE1E1E1E1:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket: fake-bucket
        S3Key: fake-key
      Handler: app.handler
      Runtime: custom
      RuntimeConfig:
        RuntimeArn: arn:aws:lambda:us-east-1:123456789012:runtime/fake
        RuntimeAlias: fake
    Metadata:
      aws:cdk:path: RootStack/customer-managed-runtime-function/Resource
      aws:asset:path: ./lambda_code
      aws:asset:is-bundled: false
      aws:asset:property: Code
  CDKMetadata:
    Type: AWS::CDK::Metadata
    Properties:
      Analytics: v2:deflate64:customermanagedruntime
    Metadata:
      aws:cdk:path: RootStack/CDKMetadata/Default
