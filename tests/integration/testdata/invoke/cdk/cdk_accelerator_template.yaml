Resources:
  # A CDK-synthesized AWS::Lambda::Function declaring AcceleratorConfig. CapacityProviderConfig is
  # spelled the way `cdk synth` emits it (nested under LambdaManagedInstancesCapacityProviderConfig)
  # so this fixture exercises the CDK branch of CapacityProviderConfig.from_dict; AcceleratorConfig
  # is a flat passthrough and has no CDK-specific nesting.
  acceleratorfunctionE1E1E1E1:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket: fake-bucket
        S3Key: fake-key
      Handler: app.echo_event
      Runtime: python3.13
      Timeout: 600
      CapacityProviderConfig:
        LambdaManagedInstancesCapacityProviderConfig:
          CapacityProviderArn: arn:aws:lambda:us-east-1:123456789012:capacity-provider/fake
          PerExecutionEnvironmentMaxConcurrency: 10
      AcceleratorConfig:
        AcceleratorMemorySize: 24
    Metadata:
      aws:cdk:path: RootStack/accelerator-function/Resource
      aws:asset:path: ./lambda_code
      aws:asset:is-bundled: false
      aws:asset:property: Code
  CDKMetadata:
    Type: AWS::CDK::Metadata
    Properties:
      Analytics: v2:deflate64:accelerator
    Metadata:
      aws:cdk:path: RootStack/CDKMetadata/Default
